name: Verificar compilação em C

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Verificar todos os arquivos C
        shell: bash
        run: |
          set -euo pipefail
          encontrou=0
          while IFS= read -r -d '' arquivo; do
            encontrou=1
            echo "Verificando ${arquivo}"
            gcc -std=c11 -Wall -Wextra -pedantic -fsyntax-only "${arquivo}"
          done < <(find listas pilhas filas arvores -type f -name '*.c' -print0 | sort -z)

          if [[ "${encontrou}" -eq 0 ]]; then
            echo "Nenhum arquivo C foi encontrado."
            exit 1
          fi
